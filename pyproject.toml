[project]
name = "deco-be85-api"
version = "0.1.0"
description = "FastAPI wrapper around the TP-Link Deco BE85 local API"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.140.13",
  "uvicorn[standard]>=0.52.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.14.2",
  "requests>=2.31",
  "pycryptodome>=3.20",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "coverage>=7.14.3",
  "ruff>=0.15.19",
  "ty>=0.0.64",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "N", "UP", "W"]
# 行長は formatter に任せる。
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
