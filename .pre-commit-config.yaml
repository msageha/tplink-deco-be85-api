# pytest は push 前、commitlint は commit message の確定時に実行するため、pre-push と commit-msg も install する。
default_install_hook_types: [pre-commit, pre-push, commit-msg]
# rebase や cherry-pick で pre-commit を経ずに作った commit も、push の前に検査する。
default_stages: [pre-commit, pre-push]

# .mise/locks/ は mise lock が生成し、mise.lock が digest で参照する。整形すると digest が合わなくなるので、どの hook にも渡さない。
exclude: ^\.mise/locks/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
      # main は PR 必須 (branch protection) なので、手元で main に commit した時点で止める。
      # push 時は送信先ではなく checkout 中のブランチを見るので、commit 時だけ実行する。
      # 検証用の mise run pre-commit は main 上でも使えるよう、この hook を SKIP する。
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]
  # ツールは mise.toml で pin した版を使う。git hook はシェルの PATH を引き継がないことがあるので、mise exec / mise run で起動する。
  # include_deleted を付けた hook は、削除だけの変更でも実行し、削除したファイルを参照する箇所を検出する。
  - repo: local
    hooks:
      - id: mise-task-docs
        name: Sync task docs into README.md
        language: system
        entry: mise run docs
        files: ^(mise\.toml|README\.md)$
        pass_filenames: false
      - id: dprint-fmt
        name: Format json/yaml/markdown/toml/Dockerfile with dprint
        language: system
        # --allow-no-files: 渡されたファイルがすべて dprint.json の excludes 対象のとき
        # (例: uv.lock のみの commit) に exit 14 (No files found) で失敗しないようにする
        entry: mise exec -- dprint fmt --allow-no-files
        types_or: [json, yaml, markdown, toml, dockerfile]
      - id: actionlint
        name: Lint GitHub Actions workflows with actionlint
        language: system
        entry: mise exec -- actionlint
        types: [yaml]
        files: ^\.github/workflows/
      - id: hadolint
        name: Lint Dockerfile with hadolint
        language: system
        entry: mise exec -- hadolint
        types: [dockerfile]
      # --force-exclude: prek はファイルを明示して渡すため、これが無いと typos.toml の extend-exclude が効かない
      - id: typos
        name: Check spelling with typos
        language: system
        entry: mise exec -- typos --force-exclude
      # token が無い環境では online audit が走らない。CI は ci.yaml の専用 step で token 付きで実行する
      - id: zizmor
        name: Audit GitHub Actions workflows and hook config with zizmor
        language: system
        entry: mise run zizmor
        # mise.toml は zizmor の版と option (mise run zizmor) を持つ
        files: ^(\.github/|\.pre-commit-config\.yaml$|mise\.toml$)
        pass_filenames: false
      # ruff・import-linter・ty・pyright の設定は pyproject.toml にあり、版は uv.lock と mise.toml で決まるので、
      # format と lint は設定だけの変更でも実行する。
      - id: format
        name: Format python sources with mise run format
        language: system
        entry: mise run format
        files: (\.py|^pyproject\.toml)$
        pass_filenames: false
      - id: lint
        name: Lint, check layers and type-check python with mise run lint
        language: system
        entry: mise run lint
        files: (\.py$|^(pyproject\.toml|uv\.lock|mise\.toml|mise\.lock)$)
        pass_filenames: false
        include_deleted: true
      - id: test
        name: Run python tests with mise run test
        language: system
        entry: mise run test
        files: (\.py$|^(pyproject\.toml|uv\.lock|mise\.toml)$)
        pass_filenames: false
        include_deleted: true
        stages: [pre-push]
      # staged 差分だけを対象にした secret スキャン。CI の gitleaks job (全履歴) は commit 後の検知なので、
      # commit 前に止める役割はこの hook が担う
      - id: gitleaks
        name: Scan staged changes for secrets with gitleaks
        language: system
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --verbose
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commitlint
        name: Lint commit message with commitlint
        # language: node により prek が node と依存を隔離環境へ自前インストールする
        language: node
        additional_dependencies:
          ["@commitlint/cli@21.2.4", "@commitlint/config-conventional@21.2.4"]
        entry: commitlint --edit
        stages: [commit-msg]
